<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Data Summarizer</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Main Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <header>
            <h1 class="gradient-text">Data Intelligence AI</h1>
            <p class="subtitle">Upload your CSV and chat instantly with your data.</p>
        </header>

        <!-- Upload Section -->
        <section id="upload-section" class="glass-panel active-section">
            <div id="drop-zone" class="drop-zone">
                <div class="drop-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16L12 8M12 8L15 11M12 8L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 15C3 17.8284 3 19.2426 3.87868 20.1213C4.75736 21 6.17157 21 9 21H15C17.8284 21 19.2426 21 20.1213 20.1213C21 19.2426 21 17.8284 21 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h3>Drag & Drop your CSV here</h3>
                    <p>or click to browse files</p>
                    <input type="file" id="file-input" accept=".csv" hidden>
                </div>
            </div>
            
            <div id="upload-progress" class="hidden">
                <div class="loader"></div>
                <p id="upload-status-text">Embedding data vectors...</p>
            </div>
        </section>

        <!-- Chat Section (Hidden initially) -->
        <section id="chat-section" class="glass-panel hidden">
            <div class="chat-header">
                <div class="status-indicator">
                    <div class="dot online"></div>
                    <span id="loaded-file-name">dataset.csv loaded</span>
                </div>
                <button id="reset-btn" class="icon-btn" title="Upload new file">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M12 4L8 8M12 4L16 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <div id="chat-history" class="chat-history">
                <div class="message system-msg">
                    <div class="avatar ai-avatar">AI</div>
                    <div class="msg-bubble">I've analyzed your data! What would you like to know?</div>
                </div>
            </div>

            <form id="chat-form" class="chat-input-area">
                <input type="text" id="question-input" placeholder="Ask a question about your data..." autocomplete="off">
                <button type="submit" id="send-btn" class="primary-btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
